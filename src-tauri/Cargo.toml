[package]
name = "discord-music-activity"
version = "0.5.0"
description = "Yandex Music Rich Presence for Discord"
authors = ["urodstvo"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "discord_music_activity_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = "2"
keyring = { version = "4", default-features = false, features = ["v1", "windows-native-keyring-store"] }
tokio = { version = "1", default-features = false, features = ["macros", "rt-multi-thread", "sync", "time", "net"] }
tokio-util = "0.7"
# TLS обязателен: без поддержки TLS tokio-tungstenite падает с ошибкой
# «TLS support not compiled in» на любом wss://-соединении.
# native-tls на Windows использует schannel (системный стек TLS).
tokio-tungstenite = { version = "0.30", features = ["native-tls"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
uuid = { version = "1", features = ["v4"] }
discord-rich-presence = "1"
reqwest = { version = "0.12", default-features = false, features = ["http2", "rustls-tls", "json"] }
dirs = "6"
regex = "1"
unicode-normalization = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter", "local-time"] }
tracing-appender = "0.2"

[target.'cfg(windows)'.dependencies]
# SMTC-сверка для коррекции ложной паузы Ynison: читает реальные
# медиа-сессии Windows. windows-future = IAsyncOperation (WinRT async),
# блокирующее ожидание реализовано поллингом Status/GetResults.
windows = { version = "0.62", features = ["Foundation", "Media_Control"] }
windows-future = "0.3"

[dev-dependencies]
tempfile = "3"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
