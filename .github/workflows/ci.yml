name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  versions:
    name: Версии синхронны
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-versions.mjs

  frontend:
    name: Frontend (typecheck + build)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  backend:
    name: Backend (fmt + test)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check
        working-directory: src-tauri
      - run: cargo test
        working-directory: src-tauri
        env:
          # build.rs требует ID только для release; для тестов даём пустышку
          DISCORD_APPLICATION_ID: "000000000000000000"
